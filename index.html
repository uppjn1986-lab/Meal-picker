<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베스트밀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#f0f0f0;font-family:'Noto Sans KR',sans-serif;min-height:100vh}
input,button{font-family:inherit}
.chip{padding:7px 14px;border-radius:999px;border:1.5px solid #2a2a2a;background:transparent;color:#707070;font-size:13px;cursor:pointer;margin:3px}
.chip.on{background:#c8f135;border-color:#c8f135;color:#000;font-weight:700}
.btn{width:100%;padding:14px;border-radius:12px;background:#c8f135;color:#000;border:none;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{background:#333;color:#666;cursor:not-allowed}
.inp{width:100%;padding:12px 14px;border-radius:10px;background:#1e1e1e;border:1px solid #2a2a2a;color:#f0f0f0;font-size:15px;outline:none;margin-bottom:14px}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:16px;padding:18px;margin-bottom:10px}
.tag{background:rgba(200,241,53,.12);border:1px solid rgba(200,241,53,.2);border-radius:999px;padding:4px 10px;color:#c8f135;font-size:12px;display:inline-block;margin:2px}
.tab{flex:1;padding:10px;border-radius:10px;background:#1e1e1e;border:1px solid #2a2a2a;color:#707070;font-size:13px;cursor:pointer}
.tab.on{background:#c8f135;border-color:#c8f135;color:#000;font-weight:700}
</style>
</head>
<body>

<div id="page-auth">
  <div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 24px">
    <div style="max-width:400px;margin:0 auto;width:100%">
      <div style="text-align:center;margin-bottom:48px">
        <div style="font-size:52px;margin-bottom:12px">🍽️</div>
        <div style="font-size:28px;font-weight:700;color:#c8f135">오늘 뭐 먹지?</div>
        <div style="color:#707070;font-size:14px;margin-top:6px">AI 맞춤 메뉴 추천 서비스</div>
      </div>
      <div style="display:flex;background:#1e1e1e;border-radius:12px;padding:4px;margin-bottom:24px">
        <button onclick="setMode('login')" id="btn-mode-login" class="tab on">로그인</button>
        <button onclick="setMode('signup')" id="btn-mode-signup" class="tab">회원가입</button>
      </div>
      <div id="nick-wrap" style="display:none"><input id="inp-nick" class="inp" placeholder="닉네임"></div>
      <input id="inp-email" class="inp" type="email" placeholder="이메일">
      <input id="inp-pw" class="inp" type="password" placeholder="비밀번호 (6자 이상)">
      <div id="auth-msg" style="color:#ff8080;font-size:13px;text-align:center;margin-bottom:12px;min-height:20px"></div>
      <button id="auth-btn" class="btn" onclick="doAuth()">로그인</button>
    </div>
  </div>
</div>

<div id="page-profile" style="display:none;padding-bottom:60px">
  <div style="background:#161616;border-bottom:1px solid #2a2a2a;padding:16px 20px;position:sticky;top:0;z-index:10">
    <span style="color:#c8f135;font-weight:700;font-size:17px">👤 프로필 설정</span>
  </div>
  <div style="max-width:480px;margin:0 auto;padding:24px 20px">
    <p style="color:#707070;font-size:14px;margin-bottom:28px">한 번만 설정하면 매번 맞춤 추천을 받을 수 있어요</p>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">성별</div><div id="g-gender" style="margin-bottom:20px"></div>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">나이대</div><div id="g-age" style="margin-bottom:20px"></div>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">직업</div><div id="g-job" style="margin-bottom:20px"></div>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">지역</div><div id="g-region" style="margin-bottom:20px"></div>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">못 먹는 음식 (복수선택)</div><div id="g-cannot" style="margin-bottom:20px"></div>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">싫어하는 음식 (복수선택)</div><div id="g-dislike" style="margin-bottom:20px"></div>
    <div style="font-size:12px;color:#707070;margin-bottom:8px">식단 조건</div><div id="g-diet" style="margin-bottom:24px"></div>
    <button class="btn" onclick="doSaveProfile()">저장하고 시작하기 →</button>
  </div>
</div>

<div id="page-home" style="display:none;padding-bottom:80px">
  <div style="background:#161616;border-bottom:1px solid #2a2a2a;padding:14px 20px;position:sticky;top:0;z-index:10">
    <div style="max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="color:#c8f135;font-weight:700;font-size:17px">🍽️ 오늘 뭐 먹지?</div>
        <div id="h-nick" style="color:#707070;font-size:11px"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="h-pts" style="background:rgba(200,241,53,.12);border:1px solid #c8f135;border-radius:20px;padding:4px 12px;color:#c8f135;font-size:13px;font-weight:700">🪙 0P</div>
        <button onclick="doLogout()" style="background:none;border:none;color:#707070;font-size:12px;cursor:pointer">로그아웃</button>
      </div>
    </div>
  </div>
  <div style="max-width:480px;margin:0 auto;padding:0 20px">
    <div style="display:flex;gap:4px;padding:14px 0 8px">
      <button class="tab on" onclick="showTab('rec',this)">🤖 추천</button>
      <button class="tab" onclick="showTab('log',this)">📋 기록</button>
      <button class="tab" onclick="showTab('pv',this)">👤 프로필</button>
    </div>
    <div id="tab-rec">
      <div class="card" style="margin-bottom:14px">
        <div style="color:#707070;font-size:13px;margin-bottom:10px">오늘 날씨가 어때요?</div>
        <div id="g-weather"></div>
      </div>
      <button class="btn" id="btn-rec" onclick="doRec()">🍴 맞춤 메뉴 추천받기</button>
      <div id="rec-result" style="margin-top:18px"></div>
    </div>
    <div id="tab-log" style="display:none"><div id="log-list"></div></div>
    <div id="tab-pv" style="display:none"><div id="pv-content"></div></div>
  </div>
</div>

<input type="file" id="file-inp" accept="image/*" style="display:none" onchange="doPhoto(event)">

<script>
const SB="https://ezhxmpiljkhnprepnhba.supabase.co";
const AK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6aHhtcGlsamtobnByZXBuaGJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMDkwMTAsImV4cCI6MjA5Mzc4NTAxMH0.PkwFl3gqafYUzvmYk9yENSWx8JuMQUGIUnu8cLWNt6Y";
let TK=null,UID=null,UEMAIL=null,PRF=null,UMENU=null,MODE="login";

// 더미 메뉴 데이터 (API 없이 테스트용)
const DUMMY_MENUS = [
  {menu:"된장찌개",emoji:"🍲",reason:"비 오는 날 따뜻한 된장찌개는 몸을 녹여줘요. 직장인에게 영양 균형이 좋은 한식입니다. 인천 지역 식재료로 만들기 좋아요.",recipe:{time:"20분",difficulty:"쉬움",steps:["냄비에 물 500ml를 끓여요","된장 2큰술을 풀어줘요","두부, 호박, 버섯을 넣어요","파를 넣고 5분 더 끓이면 완성!"]},ingredients:[{name:"된장",amount:"2큰술",keyword:"샘표 된장"},{name:"두부",amount:"1/2모",keyword:"풀무원 두부"},{name:"애호박",amount:"1/4개",keyword:"애호박"},{name:"버섯",amount:"한줌",keyword:"표고버섯"}],pairing:"공깃밥 + 김치",alternatives:["김치찌개","순두부찌개"]},
  {menu:"닭갈비",emoji:"🍗",reason:"단백질이 풍부해 직장인 점심으로 최고예요. 매콤한 맛이 스트레스 해소에 도움돼요. 오늘 날씨에 든든하게 먹기 좋아요.",recipe:{time:"25분",difficulty:"보통",steps:["닭고기를 한입 크기로 잘라요","양념장(고추장, 간장, 설탕)을 만들어요","채소와 닭고기를 양념에 버무려요","팬에 기름 두르고 볶아주면 완성!"]},ingredients:[{name:"닭고기",amount:"300g",keyword:"닭갈비용 닭고기"},{name:"고추장",amount:"2큰술",keyword:"해찬들 고추장"},{name:"양배추",amount:"1/4통",keyword:"양배추"},{name:"떡",amount:"100g",keyword:"떡볶이떡"}],pairing:"공깃밥 + 음료수",alternatives:["제육볶음","오삼불고기"]},
  {menu:"비빔밥",emoji:"🥗",reason:"채소가 풍부해 영양 균형이 완벽해요. 간단하게 만들 수 있어 바쁜 직장인에게 딱이에요. 다양한 나물로 맛과 영양을 동시에!",recipe:{time:"15분",difficulty:"쉬움",steps:["밥을 그릇에 담아요","시금치, 당근, 콩나물 나물을 올려요","계란 프라이를 올려요","고추장과 참기름을 넣고 비벼요"]},ingredients:[{name:"밥",amount:"1공기",keyword:"햇반"},{name:"시금치",amount:"한줌",keyword:"시금치"},{name:"계란",amount:"1개",keyword:"계란"},{name:"고추장",amount:"1큰술",keyword:"비빔밥 고추장"}],pairing:"미역국 + 물김치",alternatives:["덮밥","볶음밥"]}
];

function page(id){
  ["page-auth","page-profile","page-home"].forEach(function(p){
    document.getElementById(p).style.display=(p===id)?"block":"none";
  });
}
function H(){return{apikey:AK,Authorization:"Bearer "+TK,"Content-Type":"application/json"};}
async function sbGet(path){const r=await fetch(SB+path,{headers:H()});return r.json();}

const REGIONS=["서울","경기 북부","경기 남부","인천","강원","충북","충남","대전","세종","전북","전남","광주","경북","경남","대구","울산","부산","제주"];
const JOBS=["직장인","학생","자영업자","주부","프리랜서","무직","기타"];
const AGES=["10대","20대","30대","40대","50대","60대 이상"];
const DIETS=["없음","단백질 위주","채소 위주","저탄수화물","저칼로리","다이어트식","벌크업식"];
const CANNOT=["돼지고기","소고기","닭고기","해산물","유제품","글루텐","견과류","달걀","없음"];
const DISLIKE=["매운 음식","단 음식","짠 음식","기름진 음식","날 것","향신료","없음"];
const WEATHER=["☀️ 맑음","🌧️ 비","❄️ 눈","🌫️ 흐림","🌬️ 바람","🌡️ 더위","🥶 추위"];
const SEL={gender:"",age:"",job:"",region:"",cannot:[],dislike:[],diet:"없음",weather:""};

function chips(id,items,field,multi){
  const el=document.getElementById(id);el.innerHTML="";
  items.forEach(function(v){
    const b=document.createElement("button");
    b.className="chip"+((multi?SEL[field].indexOf(v)>=0:SEL[field]===v)?" on":"");
    b.textContent=v;
    b.onclick=function(){
      if(multi){const i=SEL[field].indexOf(v);if(i>=0)SEL[field].splice(i,1);else SEL[field].push(v);}
      else SEL[field]=v;
      chips(id,items,field,multi);
    };
    el.appendChild(b);
  });
}

function setMode(m){
  MODE=m;
  document.getElementById("btn-mode-login").className="tab"+(m==="login"?" on":"");
  document.getElementById("btn-mode-signup").className="tab"+(m==="signup"?" on":"");
  document.getElementById("nick-wrap").style.display=m==="signup"?"block":"none";
  document.getElementById("auth-btn").textContent=m==="login"?"로그인":"가입하기";
}

async function doAuth(){
  const email=document.getElementById("inp-email").value.trim();
  const pw=document.getElementById("inp-pw").value;
  const msg=document.getElementById("auth-msg");
  const btn=document.getElementById("auth-btn");
  if(!email||!pw){msg.textContent="이메일과 비밀번호를 입력해주세요";return;}
  btn.textContent="처리 중...";btn.disabled=true;msg.textContent="";
  try{
    if(MODE==="signup"){
      const nick=document.getElementById("inp-nick").value||"사용자";
      const su=await fetch(SB+"/auth/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:AK},body:JSON.stringify({email:email,password:pw})});
      const sd=await su.json();
      if(sd.error){msg.textContent=sd.error.message||"가입 실패";return;}
      const li=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:AK},body:JSON.stringify({email:email,password:pw})});
      const ld=await li.json();
      if(!ld.access_token){msg.textContent="로그인 실패. 다시 시도해주세요";return;}
      TK=ld.access_token;UID=ld.user.id;UEMAIL=email;
      await fetch(SB+"/rest/v1/profiles",{method:"POST",headers:Object.assign({},H(),{Prefer:"return=representation"}),body:JSON.stringify({id:UID,email:email,nickname:nick,points:0})});
      localStorage.setItem("ms",JSON.stringify({t:TK,u:UID,e:email}));
      initProfile();page("page-profile");
    } else {
      const li=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:AK},body:JSON.stringify({email:email,password:pw})});
      const ld=await li.json();
      if(!ld.access_token){msg.textContent=ld.error_description||ld.msg||"로그인 실패";return;}
      TK=ld.access_token;UID=ld.user.id;UEMAIL=email;
      localStorage.setItem("ms",JSON.stringify({t:TK,u:UID,e:email}));
      const pd=await sbGet("/rest/v1/profiles?id=eq."+UID);
      if(Array.isArray(pd)&&pd[0]){PRF=pd[0];if(PRF.gender){initHome();page("page-home");}else{initProfile();page("page-profile");}}
      else{initProfile();page("page-profile");}
    }
  }catch(e){msg.textContent="오류: "+e.message;}
  finally{btn.textContent=MODE==="login"?"로그인":"가입하기";btn.disabled=false;}
}

function initProfile(){
  chips("g-gender",["남성","여성"],"gender",false);
  chips("g-age",AGES,"age",false);
  chips("g-job",JOBS,"job",false);
  chips("g-region",REGIONS,"region",false);
  chips("g-cannot",CANNOT,"cannot",true);
  chips("g-dislike",DISLIKE,"dislike",true);
  chips("g-diet",DIETS,"diet",false);
}

async function doSaveProfile(){
  if(!SEL.gender||!SEL.age||!SEL.job||!SEL.region){alert("성별, 나이대, 직업, 지역은 필수예요!");return;}
  await fetch(SB+"/rest/v1/profiles",{method:"POST",headers:Object.assign({},H(),{Prefer:"resolution=merge-duplicates"}),body:JSON.stringify({id:UID,gender:SEL.gender,age_group:SEL.age,job:SEL.job,region:SEL.region,cannot_eat:SEL.cannot,dislike_eat:SEL.dislike,diet_condition:SEL.diet})});
  const pd=await sbGet("/rest/v1/profiles?id=eq."+UID);
  PRF=pd[0];initHome();page("page-home");
}

function initHome(){
  document.getElementById("h-nick").textContent=PRF&&PRF.nickname?PRF.nickname:UEMAIL;
  document.getElementById("h-pts").textContent="🪙 "+(PRF&&PRF.points?PRF.points:0)+"P";
  chips("g-weather",WEATHER,"weather",false);
  loadLogs();renderPV();
}

function showTab(name,btn){
  ["rec","log","pv"].forEach(function(t){document.getElementById("tab-"+t).style.display=(t===name)?"block":"none";});
  document.querySelectorAll("#page-home .tab").forEach(function(b){b.className="tab";});
  btn.className="tab on";
  if(name==="log")loadLogs();
}

async function doRec(){
  if(!SEL.weather){alert("날씨를 선택해주세요!");return;}
  const btn=document.getElementById("btn-rec");
  btn.textContent="🤔 추천 중...";btn.disabled=true;
  document.getElementById("rec-result").innerHTML="";
  // 더미 데이터에서 랜덤 선택
  await new Promise(function(r){setTimeout(r,1000);}); // 1초 딜레이로 자연스럽게
  const r=DUMMY_MENUS[Math.floor(Math.random()*DUMMY_MENUS.length)];
  renderRec(r);
  btn.textContent="🍴 맞춤 메뉴 추천받기";btn.disabled=false;
}

function renderRec(r){
  const steps=r.recipe.steps.map(function(s,i){return '<div style="display:flex;gap:10px;margin-bottom:10px;align-items:flex-start"><div style="width:22px;height:22px;border-radius:50%;background:rgba(200,241,53,.12);border:1px solid #c8f135;color:#c8f135;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">'+(i+1)+'</div><div style="color:#f0f0f0;font-size:14px;line-height:1.6;padding-top:2px">'+s+'</div></div>';}).join("");
  const ings=r.ingredients.map(function(g){return '<a href="https://www.coupang.com/np/search?q='+encodeURIComponent(g.keyword)+'" target="_blank" style="display:flex;justify-content:space-between;padding:10px 12px;border-radius:9px;background:#0d0d0d;margin-bottom:6px;text-decoration:none"><div><div style="color:#f0f0f0;font-size:14px;font-weight:500">'+g.name+'</div><div style="color:#707070;font-size:12px">'+g.amount+'</div></div><div style="color:#c8f135;font-size:12px;align-self:center">구매 →</div></a>';}).join("");
  const alts=r.alternatives.map(function(a){return '<span class="tag">'+a+'</span>';}).join("");
  const menu=r.menu.replace(/'/g,"\\'");
  document.getElementById("rec-result").innerHTML='<div style="background:#0d0d0d;border:1px solid #333;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#c8f135">⚠️ 테스트 모드 - API 연결 시 실제 AI 추천으로 바뀌어요</div><div style="background:#161616;border:1px solid #c8f135;border-radius:20px;padding:22px;margin-bottom:10px"><div style="font-size:44px;margin-bottom:6px">'+r.emoji+'</div><div style="font-size:24px;font-weight:700;margin-bottom:8px">'+r.menu+'</div><p style="color:#707070;font-size:14px;line-height:1.7;margin:0 0 14px">'+r.reason+'</p><span class="tag">⏱ '+r.recipe.time+'</span> <span class="tag">📊 '+r.recipe.difficulty+'</span> <span class="tag">🥂 '+r.pairing+'</span></div><div class="card"><div style="font-weight:600;margin-bottom:12px">📋 레시피</div>'+steps+'</div><div class="card"><div style="font-weight:600;margin-bottom:12px">🛒 재료 구매 (클릭→쿠팡)</div>'+ings+'</div><div class="card"><div style="font-weight:600;margin-bottom:8px">🔄 다른 추천</div>'+alts+'</div><div class="card" style="text-align:center"><div style="font-size:28px;margin-bottom:6px">📸</div><div style="font-weight:600;margin-bottom:4px">먹은 사진 인증하고 +50P!</div><div style="color:#707070;font-size:13px;margin-bottom:14px">사진을 올리면 포인트를 드려요</div><button class="btn" onclick="startUpload(\''+menu+'\')">📷 사진 업로드</button></div>';
}

function startUpload(menu){UMENU=menu;document.getElementById("file-inp").click();}

async function doPhoto(e){
  const file=e.target.files[0];if(!file||!UMENU)return;
  alert("사진을 분석 중이에요. 잠시 기다려주세요...");
  const path=UID+"/"+Date.now()+".jpg";
  await fetch(SB+"/storage/v1/object/meal-photos/"+path,{method:"POST",headers:{apikey:AK,Authorization:"Bearer "+TK},body:file});
  const photoUrl=SB+"/storage/v1/object/public/meal-photos/"+path;
  // 테스트 모드: 무조건 인증 성공 처리
  const earned=50;
  await fetch(SB+"/rest/v1/meal_logs",{method:"POST",headers:Object.assign({},H(),{Prefer:"return=representation"}),body:JSON.stringify({user_id:UID,menu_name:UMENU,photo_url:photoUrl,ai_verified:true,points_earned:earned})});
  const np=(PRF.points||0)+earned;
  await fetch(SB+"/rest/v1/profiles?id=eq."+UID,{method:"PATCH",headers:H(),body:JSON.stringify({points:np})});
  PRF.points=np;document.getElementById("h-pts").textContent="🪙 "+np+"P";
  alert("✅ 사진 업로드 성공! +"+earned+"P 지급! (테스트 모드)");
  loadLogs();UMENU=null;e.target.value="";
}

async function loadLogs(){
  try{
    const data=await sbGet("/rest/v1/meal_logs?user_id=eq."+UID+"&order=created_at.desc&limit=20");
    const el=document.getElementById("log-list");
    if(!Array.isArray(data)||!data.length){el.innerHTML='<div style="text-align:center;padding:60px 0;color:#707070"><div style="font-size:40px;margin-bottom:10px">🍽️</div>아직 기록이 없어요</div>';return;}
    el.innerHTML=data.map(function(l){return '<div class="card"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:600">'+l.menu_name+'</div><div style="color:#707070;font-size:12px;margin-top:3px">'+new Date(l.created_at).toLocaleDateString("ko-KR")+'</div></div><div style="text-align:right"><div style="color:'+(l.ai_verified?"#c8f135":"#ff4d4d")+';font-size:13px;font-weight:600">'+(l.ai_verified?"✅ 인증":"❌ 미인증")+'</div>'+(l.points_earned>0?'<div style="color:#c8f135;font-size:12px">+'+l.points_earned+'P</div>':"")+'</div></div>'+(l.photo_url?'<img src="'+l.photo_url+'" style="width:100%;border-radius:10px;margin-top:10px;max-height:180px;object-fit:cover">':"")+' </div>';}).join("");
  }catch(e){}
}

function renderPV(){
  const p=PRF||{};
  document.getElementById("pv-content").innerHTML='<div class="card"><div style="color:#c8f135;font-weight:700;font-size:20px;margin-bottom:4px">'+(p.nickname||"사용자")+'</div><div style="color:#707070;font-size:13px;margin-bottom:16px">'+(UEMAIL||"")+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+[["성별",p.gender],["나이대",p.age_group],["직업",p.job],["지역",p.region],["식단조건",p.diet_condition],["총 포인트","🪙 "+(p.points||0)+"P"]].map(function(a){return '<div style="background:#0d0d0d;border-radius:10px;padding:10px 12px"><div style="color:#707070;font-size:11px">'+a[0]+'</div><div style="color:'+(a[0]==="총 포인트"?"#c8f135":"#f0f0f0")+';font-weight:600;font-size:14px">'+(a[1]||"-")+'</div></div>';}).join("")+'</div></div><div class="card"><div style="font-weight:600;margin-bottom:8px">못 먹는 음식</div><div style="margin-bottom:14px">'+(p.cannot_eat&&p.cannot_eat.length?p.cannot_eat.map(function(f){return '<span class="tag">'+f+'</span>';}).join(""):"<span style='color:#707070'>없음</span>")+'</div><div style="font-weight:600;margin-bottom:8px">싫어하는 음식</div><div>'+(p.dislike_eat&&p.dislike_eat.length?p.dislike_eat.map(function(f){return '<span class="tag">'+f+'</span>';}).join(""):"<span style='color:#707070'>없음</span>")+'</div></div>';
}

function doLogout(){TK=null;UID=null;UEMAIL=null;PRF=null;localStorage.removeItem("ms");page("page-auth");}

window.onload=async function(){
  page("page-auth");
  try{
    const saved=localStorage.getItem("ms");
    if(saved){
      const s=JSON.parse(saved);TK=s.t;UID=s.u;UEMAIL=s.e;
      const pd=await sbGet("/rest/v1/profiles?id=eq."+UID);
      if(Array.isArray(pd)&&pd[0]){PRF=pd[0];if(PRF.gender){initHome();page("page-home");return;}else{initProfile();page("page-profile");return;}}
    }
  }catch(e){}
  page("page-auth");
};
</script>
</body>
</html>
